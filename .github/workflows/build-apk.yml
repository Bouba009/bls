name: Build BLS Smart Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/blssmartbrowser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BLS_Smart_Browser"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.blssmartbrowser"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.blssmartbrowser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.BLSSmartBrowser" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#161b22</item>
                  <item name="android:navigationBarColor">#0d1117</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="BLS Smart Browser"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.BLSSmartBrowser">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/blssmartbrowser/MainActivity.kt <<'EOF'
          package com.example.blssmartbrowser

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          data class TouchPoint(
              val x: Float,
              val y: Float,
              val delay: Long
          )

          class MainActivity : AppCompatActivity() {

              companion object {
                  private const val BLS_URL =
                      "https://algeria.blsinternational.com/my-account"
              }

              private lateinit var webView: WebView
              private lateinit var status: TextView
              private lateinit var count: TextView
              private lateinit var menu: LinearLayout

              private val handler = Handler(Looper.getMainLooper())

              private val touches =
                  mutableListOf<TouchPoint>()

              private var recording = false
              private var autoRefresh = false
              private var refreshSeconds = 30L
              private var lastTouch = 0L

              private val autoRunnable =
                  object : Runnable {
                      override fun run() {

                          if (autoRefresh) {

                              webView.reload()

                              status.text =
                                  "تحديث تلقائي"

                              handler.postDelayed(
                                  this,
                                  refreshSeconds * 1000L
                              )
                          }
                      }
                  }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  val root =
                      FrameLayout(this)

                  webView =
                      WebView(this)

                  root.addView(
                      webView,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  webView.settings.apply {

                      javaScriptEnabled = true

                      domStorageEnabled = true

                      databaseEnabled = true

                      loadsImagesAutomatically = true

                      javaScriptCanOpenWindowsAutomatically =
                          true

                      setSupportZoom(false)
                  }

                  webView.webChromeClient =
                      WebChromeClient()

                  webView.webViewClient =
                      object : WebViewClient() {

                          override fun onPageStarted(
                              view: WebView?,
                              url: String?,
                              favicon: android.graphics.Bitmap?
                          ) {

                              status.text =
                                  "جاري التحميل..."
                          }

                          override fun onPageFinished(
                              view: WebView?,
                              url: String?
                          ) {

                              status.text =
                                  "تم التحميل"
                          }
                      }

                  webView.setOnTouchListener {
                          _, event ->

                      if (
                          recording &&
                          event.actionMasked ==
                          MotionEvent.ACTION_DOWN
                      ) {

                          val now =
                              System.currentTimeMillis()

                          val delay =
                              if (lastTouch == 0L)
                                  0L
                              else
                                  (now - lastTouch)
                                      .coerceIn(
                                          100L,
                                          3000L
                                      )

                          touches.add(
                              TouchPoint(
                                  event.x,
                                  event.y,
                                  delay
                              )
                          )

                          lastTouch = now

                          count.text =
                              "Touches: ${touches.size}"
                      }

                      false
                  }

                  createOverlay(root)

                  setContentView(root)

                  webView.loadUrl(BLS_URL)
              }

              private fun createOverlay(
                  root: FrameLayout
              ) {

                  val bottom =
                      LinearLayout(this)

                  bottom.orientation =
                      LinearLayout.HORIZONTAL

                  bottom.gravity =
                      Gravity.CENTER

                  bottom.setBackgroundColor(
                      Color.rgb(
                          22,
                          27,
                          34
                      )
                  )

                  val title =
                      TextView(this)

                  title.text =
                      "BLS Browser"

                  title.textSize =
                      11f

                  title.setTextColor(
                      Color.LTGRAY
                  )

                  title.gravity =
                      Gravity.CENTER

                  status =
                      TextView(this)

                  status.text =
                      "جاهز"

                  status.textSize =
                      11f

                  status.setTextColor(
                      Color.rgb(
                          88,
                          166,
                          255
                      )
                  )

                  status.gravity =
                      Gravity.CENTER

                  count =
                      TextView(this)

                  count.text =
                      "Touches: 0"

                  count.textSize =
                      11f

                  count.setTextColor(
                      Color.LTGRAY
                  )

                  count.gravity =
                      Gravity.CENTER

                  bottom.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          50,
                          1f
                      )
                  )

                  bottom.addView(
                      status,
                      LinearLayout.LayoutParams(
                          0,
                          50,
                          1f
                      )
                  )

                  bottom.addView(
                      count,
                      LinearLayout.LayoutParams(
                          0,
                          50,
                          1f
                      )
                  )

                  val bottomParams =
                      FrameLayout.LayoutParams(
                          -1,
                          50
                      )

                  bottomParams.gravity =
                      Gravity.BOTTOM

                  root.addView(
                      bottom,
                      bottomParams
                  )

                  menu =
                      LinearLayout(this)

                  menu.orientation =
                      LinearLayout.VERTICAL

                  menu.gravity =
                      Gravity.CENTER

                  menu.visibility =
                      View.GONE

                  val box =
                      FrameLayout(this)

                  val boxParams =
                      FrameLayout.LayoutParams(
                          70,
                          390
                      )

                  boxParams.gravity =
                      Gravity.END or
                      Gravity.BOTTOM

                  boxParams.setMargins(
                      0,
                      0,
                      12,
                      62
                  )

                  root.addView(
                      box,
                      boxParams
                  )

                  box.addView(
                      menu,
                      FrameLayout.LayoutParams(
                          60,
                          -2,
                          Gravity.BOTTOM or
                          Gravity.CENTER_HORIZONTAL
                      )
                  )

                  fun addButton(
                      text: String,
                      action: () -> Unit
                  ) {

                      val button =
                          TextView(this)

                      button.text =
                          text

                      button.textSize =
                          19f

                      button.gravity =
                          Gravity.CENTER

                      button.setTextColor(
                          Color.WHITE
                      )

                      button.background =
                          GradientDrawable().apply {

                              shape =
                                  GradientDrawable.OVAL

                              setColor(
                                  Color.rgb(
                                      33,
                                      38,
                                      45
                                  )
                              )
                          }

                      button.elevation =
                          8f

                      button.setOnClickListener {
                          action()
                      }

                      val params =
                          LinearLayout.LayoutParams(
                              48,
                              48
                          )

                      params.gravity =
                          Gravity.CENTER_HORIZONTAL

                      params.setMargins(
                          0,
                          0,
                          0,
                          8
                      )

                      menu.addView(
                          button,
                          params
                      )
                  }

                  addButton("↻") {
                      webView.reload()
                  }

                  addButton("●") {
                      toggleRecording()
                  }

                  addButton("▶") {
                      replayTouches()
                  }

                  addButton("✕") {

                      touches.clear()

                      count.text =
                          "Touches: 0"

                      status.text =
                          "تم المسح"
                  }

                  addButton("⏱") {
                      toggleAutoRefresh()
                  }

                  val main =
                      TextView(this)

                  main.text =
                      "☰"

                  main.textSize =
                      24f

                  main.gravity =
                      Gravity.CENTER

                  main.setTextColor(
                      Color.WHITE
                  )

                  main.background =
                      GradientDrawable().apply {

                          shape =
                              GradientDrawable.OVAL

                          setColor(
                              Color.rgb(
                                  35,
                                  134,
                                  54
                              )
                          )
                      }

                  main.elevation =
                      10f

                  main.setOnClickListener {

                      menu.visibility =
                          if (
                              menu.visibility ==
                              View.VISIBLE
                          )
                              View.GONE
                          else
                              View.VISIBLE
                  }

                  val mainParams =
                      FrameLayout.LayoutParams(
                          60,
                          60
                      )

                  mainParams.gravity =
                      Gravity.BOTTOM or
                      Gravity.CENTER_HORIZONTAL

                  box.addView(
                      main,
                      mainParams
                  )
              }

              private fun toggleRecording() {

                  recording =
                      !recording

                  if (recording) {

                      touches.clear()

                      lastTouch = 0L

                      count.text =
                          "Touches: 0"

                      status.text =
                          "تسجيل اللمسات"

                  } else {

                      status.text =
                          "تم إيقاف التسجيل"
                  }
              }

              private fun replayTouches() {

                  if (touches.isEmpty()) {

                      Toast.makeText(
                          this,
                          "لا توجد لمسات مسجلة",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }

                  status.text =
                      "إعادة التشغيل..."

                  replay(0)
              }

              private fun replay(
                  index: Int
              ) {

                  if (
                      index >= touches.size
                  ) {

                      status.text =
                          "انتهى التشغيل"

                      return
                  }

                  val point =
                      touches[index]

                  handler.postDelayed({

                      showMarker(
                          point.x,
                          point.y
                      )

                      replay(index + 1)

                  }, point.delay)
              }

              private fun showMarker(
                  x: Float,
                  y: Float
              ) {

                  val marker =
                      View(this)

                  marker.background =
                      GradientDrawable().apply {

                          shape =
                              GradientDrawable.OVAL

                          setColor(
                              Color.argb(
                                  120,
                                  218,
                                  54,
                                  51
                              )
                          )

                          setStroke(
                              3,
                              Color.WHITE
                          )
                      }

                  val params =
                      FrameLayout.LayoutParams(
                          26,
                          26
                      )

                  params.leftMargin =
                      x.toInt() - 13

                  params.topMargin =
                      y.toInt() - 13

                  val root =
                      webView.parent
                          as FrameLayout

                  root.addView(
                      marker,
                      params
                  )

                  handler.postDelayed({

                      root.removeView(
                          marker
                      )

                  }, 450)
              }

              private fun toggleAutoRefresh() {

                  if (autoRefresh) {

                      autoRefresh =
                          false

                      handler.removeCallbacks(
                          autoRunnable
                      )

                      status.text =
                          "التحديث متوقف"

                  } else {

                      autoRefresh =
                          true

                      status.text =
                          "Auto: ${refreshSeconds}s"

                      handler.removeCallbacks(
                          autoRunnable
                      )

                      handler.postDelayed(
                          autoRunnable,
                          refreshSeconds * 1000L
                      )
                  }
              }

              override fun onBackPressed() {

                  if (
                      webView.canGoBack()
                  ) {

                      webView.goBack()

                  } else {

                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {

                  handler.removeCallbacksAndMessages(
                      null
                  )

                  webView.destroy()

                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <meta charset="utf-8">
          <title>BLS Smart Browser</title>
          <body style="background:#0d1117;color:white;font-family:Arial;text-align:center;padding:40px">
          <h1>BLS Smart Browser</h1>
          <p>Android WebView interface.</p>
          </body>
          </html>
          EOF

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLS-Smart-Browser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
