name: Build BLS Smart Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/example/blssmartbrowser
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BLS_Smart_Browser"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.blssmartbrowser"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.blssmartbrowser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="Theme.BLSSmartBrowser"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#161B22</item>
                  <item name="android:navigationBarColor">#0D1117</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="BLS Smart Browser"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.BLSSmartBrowser">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/blssmartbrowser/MainActivity.kt <<'EOF'
          package com.example.blssmartbrowser

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          data class TouchPoint(
              val x: Float,
              val y: Float,
              val delay: Long
          )

          class MainActivity : AppCompatActivity() {

              companion object {
                  private const val BLS_URL =
                      "https://algeria.blsinternational.com/my-account"
              }

              private lateinit var webView: WebView
              private lateinit var status: TextView
              private lateinit var count: TextView
              private lateinit var menu: LinearLayout

              private val handler =
                  Handler(Looper.getMainLooper())

              private val touches =
                  mutableListOf<TouchPoint>()

              private var recording = false
              private var autoRefresh = false
              private var refreshSeconds = 30L
              private var lastTouch = 0L

              private val autoRefreshTask =
                  object : Runnable {

                      override fun run() {

                          if (autoRefresh) {

                              webView.reload()

                              status.text =
                                  "تحديث تلقائي"

                              handler.postDelayed(
                                  this,
                                  refreshSeconds * 1000L
                              )
                          }
                      }
                  }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  val root =
                      FrameLayout(this)

                  webView =
                      WebView(this)

                  root.addView(
                      webView,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  webView.settings.apply {

                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      loadsImagesAutomatically = true

                      javaScriptCanOpenWindowsAutomatically =
                          true
                  }

                  webView.webChromeClient =
                      WebChromeClient()

                  webView.webViewClient =
                      object : WebViewClient() {

                          override fun onPageStarted(
                              view: WebView?,
                              url: String?,
                              favicon: android.graphics.Bitmap?
                          ) {

                              status.text =
                                  "جاري التحميل..."
                          }

                          override fun onPageFinished(
                              view: WebView?,
                              url: String?
                          ) {

                              status.text =
                                  "تم التحميل"
                          }
                      }

                  webView.setOnTouchListener {

                      _, event ->

                      if (
                          recording &&
                          event.actionMasked ==
                          MotionEvent.ACTION_DOWN
                      ) {

                          val now =
                              System.currentTimeMillis()

                          val delay =
                              if (lastTouch == 0L) {
                                  0L
                              } else {
                                  (now - lastTouch)
                                      .coerceIn(
                                          100L,
                                          3000L
                                      )
                              }

                          touches.add(
                              TouchPoint(
                                  event.x,
                                  event.y,
                                  delay
                              )
                          )

                          lastTouch = now

                          count.text =
                              "Touches: ${touches.size}"
                      }

                      false
                  }

                  createInterface(root)

                  setContentView(root)

                  webView.loadUrl(BLS_URL)
              }

              private fun createInterface(
                  root: FrameLayout
              ) {

                  val bottom =
                      LinearLayout(this)

                  bottom.orientation =
                      LinearLayout.HORIZONTAL

                  bottom.gravity =
                      Gravity.CENTER

                  bottom.setBackgroundColor(
                      Color.rgb(
                          22,
                          27,
                          34
                      )
                  )

                  val title =
                      makeText("BLS Browser")

                  status =
                      makeText("جاهز")

                  count =
                      makeText("Touches: 0")

                  bottom.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          50,
                          1f
                      )
                  )

                  bottom.addView(
                      status,
                      LinearLayout.LayoutParams(
                          0,
                          50,
                          1f
                      )
                  )

                  bottom.addView(
                      count,
                      LinearLayout.LayoutParams(
                          0,
                          50,
                          1f
                      )
                  )

                  val bottomParams =
                      FrameLayout.LayoutParams(
                          -1,
                          50
                      )

                  bottomParams.gravity =
                      Gravity.BOTTOM

                  root.addView(
                      bottom,
                      bottomParams
                  )

                  menu =
                      LinearLayout(this)

                  menu.orientation =
                      LinearLayout.VERTICAL

                  menu.gravity =
                      Gravity.CENTER

                  menu.visibility =
                      View.GONE

                  val container =
                      FrameLayout(this)

                  val containerParams =
                      FrameLayout.LayoutParams(
                          75,
                          390
                      )

                  containerParams.gravity =
                      Gravity.END or
                      Gravity.BOTTOM

                  containerParams.setMargins(
                      0,
                      0,
                      12,
                      65
                  )

                  root.addView(
                      container,
                      containerParams
                  )

                  container.addView(
                      menu,
                      FrameLayout.LayoutParams(
                          60,
                          -2,
                          Gravity.TOP or
                          Gravity.CENTER_HORIZONTAL
                      )
                  )

                  addButton("↻") {
                      webView.reload()
                  }

                  addButton("●") {
                      toggleRecording()
                  }

                  addButton("▶") {
                      replayTouches()
                  }

                  addButton("✕") {

                      touches.clear()

                      count.text =
                          "Touches: 0"

                      status.text =
                          "تم المسح"
                  }

                  addButton("⏱") {
                      toggleAutoRefresh()
                  }

                  val mainButton =
                      makeText("☰")

                  mainButton.textSize =
                      24f

                  mainButton.setTextColor(
                      Color.WHITE
                  )

                  mainButton.background =
                      GradientDrawable().apply {

                          shape =
                              GradientDrawable.OVAL

                          setColor(
                              Color.rgb(
                                  35,
                                  134,
                                  54
                              )
                          )
                      }

                  mainButton.setOnClickListener {

                      menu.visibility =
                          if (
                              menu.visibility ==
                              View.VISIBLE
                          ) {
                              View.GONE
                          } else {
                              View.VISIBLE
                          }
                  }

                  val mainParams =
                      FrameLayout.LayoutParams(
                          60,
                          60
                      )

                  mainParams.gravity =
                      Gravity.BOTTOM or
                      Gravity.CENTER_HORIZONTAL

                  container.addView(
                      mainButton,
                      mainParams
                  )
              }

              private fun makeText(
                  textValue: String
              ): TextView {

                  return TextView(this).apply {

                      text = textValue
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                  }
              }

              private fun addButton(
                  textValue: String,
                  action: () -> Unit
              ) {

                  val button =
                      makeText(textValue)

                  button.textSize =
                      20f

                  button.setTextColor(
                      Color.WHITE
                  )

                  button.background =
                      GradientDrawable().apply {

                          shape =
                              GradientDrawable.OVAL

                          setColor(
                              Color.rgb(
                                  33,
                                  38,
                                  45
                              )
                          )
                      }

                  button.setOnClickListener {
                      action()
                  }

                  val params =
                      LinearLayout.LayoutParams(
                          48,
                          48
                      )

                  params.gravity =
                      Gravity.CENTER_HORIZONTAL

                  params.setMargins(
                      0,
                      0,
                      0,
                      8
                  )

                  menu.addView(
                      button,
                      params
                  )
              }

              private fun toggleRecording() {

                  recording =
                      !recording

                  if (recording) {

                      touches.clear()

                      lastTouch = 0L

                      count.text =
                          "Touches: 0"

                      status.text =
                          "تسجيل اللمسات"

                  } else {

                      status.text =
                          "تم إيقاف التسجيل"
                  }
              }

              private fun replayTouches() {

                  if (touches.isEmpty()) {

                      Toast.makeText(
                          this,
                          "لا توجد لمسات مسجلة",
                          Toast.LENGTH_SHORT
                      ).show()

                      return
                  }

                  status.text =
                      "إعادة التشغيل..."

                  replay(0)
              }

              private fun replay(
                  index: Int
              ) {

                  if (
                      index >= touches.size
                  ) {

                      status.text =
                          "انتهى التشغيل"

                      return
                  }

                  val point =
                      touches[index]

                  handler.postDelayed({

                      showMarker(
                          point.x,
                          point.y
                      )

                      replay(index + 1)

                  }, point.delay)
              }

              private fun showMarker(
                  x: Float,
                  y: Float
              ) {

                  val marker =
                      View(this)

                  marker.background =
                      GradientDrawable().apply {

                          shape =
                              GradientDrawable.OVAL

                          setColor(
                              Color.argb(
                                  120,
                                  218,
                                  54,
                                  51
                              )
                          )

                          setStroke(
                              3,
                              Color.WHITE
                          )
                      }

                  val params =
                      FrameLayout.LayoutParams(
                          26,
                          26
                      )

                  params.leftMargin =
                      x.toInt() - 13

                  params.topMargin =
                      y.toInt() - 13

                  val root =
                      webView.parent
                          as FrameLayout

                  root.addView(
                      marker,
                      params
                  )

                  handler.postDelayed({

                      root.removeView(marker)

                  }, 450)
              }

              private fun toggleAutoRefresh() {

                  if (autoRefresh) {

                      autoRefresh =
                          false

                      handler.removeCallbacks(
                          autoRefreshTask
                      )

                      status.text =
                          "التحديث متوقف"

                  } else {

                      autoRefresh =
                          true

                      status.text =
                          "Auto: 30s"

                      handler.removeCallbacks(
                          autoRefreshTask
                      )

                      handler.postDelayed(
                          autoRefreshTask,
                          refreshSeconds * 1000L
                      )
                  }
              }

              override fun onBackPressed() {

                  if (
                      webView.canGoBack()
                  ) {

                      webView.goBack()

                  } else {

                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {

                  handler.removeCallbacksAndMessages(
                      null
                  )

                  webView.destroy()

                  super.onDestroy()
              }
          }
          EOF

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLS-Smart-Browser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
