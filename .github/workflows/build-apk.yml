name: Build BLS Smart Browser APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/bls/smartbrowser
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BLS_Smart_Browser"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.bls.smartbrowser"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.bls.smartbrowser"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="BLS Smart Browser"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/bls/smartbrowser/MainActivity.kt <<'EOF'
          package com.bls.smartbrowser

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var statusText: TextView

              private val handler = Handler(Looper.getMainLooper())
              private var autoRefresh = false

              private val refreshRunnable = object : Runnable {
                  override fun run() {
                      if (autoRefresh) {
                          webView.reload()
                          handler.postDelayed(this, 30000)
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.WHITE)

                  webView = WebView(this)

                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.databaseEnabled = true
                  webView.settings.loadsImagesAutomatically = true
                  webView.settings.allowFileAccess = true
                  webView.settings.javaScriptCanOpenWindowsAutomatically = true
                  webView.settings.setSupportMultipleWindows(true)

                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          statusText.text = "✓ Page loaded"
                      }

                      override fun onReceivedError(
                          view: WebView?,
                          errorCode: Int,
                          description: String?,
                          failingUrl: String?
                      ) {
                          statusText.text = "⚠ Loading error"
                      }
                  }

                  webView.webChromeClient = WebChromeClient()

                  webView.setOnTouchListener { _, event ->
                      if (event.action == MotionEvent.ACTION_UP) {
                          statusText.text =
                              "Touch: ${event.x.toInt()}, ${event.y.toInt()}"
                      }
                      false
                  }

                  root.addView(
                      webView,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  val controls = LinearLayout(this)
                  controls.orientation = LinearLayout.HORIZONTAL
                  controls.gravity = Gravity.CENTER
                  controls.setBackgroundColor(Color.DKGRAY)

                  val reloadButton = Button(this)
                  reloadButton.text = "Reload"
                  reloadButton.setOnClickListener {
                      webView.reload()
                  }

                  val autoButton = Button(this)
                  autoButton.text = "Auto: OFF"
                  autoButton.setOnClickListener {
                      autoRefresh = !autoRefresh

                      if (autoRefresh) {
                          autoButton.text = "Auto: ON"
                          handler.post(refreshRunnable)
                          Toast.makeText(
                              this,
                              "Auto refresh: 30 seconds",
                              Toast.LENGTH_SHORT
                          ).show()
                      } else {
                          autoButton.text = "Auto: OFF"
                          handler.removeCallbacks(refreshRunnable)
                      }
                  }

                  controls.addView(reloadButton)
                  controls.addView(autoButton)

                  root.addView(
                      controls,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  statusText = TextView(this)
                  statusText.text = "BLS Smart Browser"
                  statusText.setTextColor(Color.WHITE)
                  statusText.setBackgroundColor(Color.BLACK)
                  statusText.gravity = Gravity.CENTER
                  statusText.setPadding(8, 8, 8, 8)

                  root.addView(
                      statusText,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)

                  webView.loadUrl(
                      "https://algeria.blsinternational.com/my-account"
                  )
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(refreshRunnable)
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLS-Smart-Browser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
